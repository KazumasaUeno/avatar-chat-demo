<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アバターと話す</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--text:#1d2330;--muted:#6b7280;--accent:#3b6fd8;--me:#dfe8fb}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif}
#stage{position:fixed;inset:0 0 168px 0}
#panel{position:fixed;left:0;right:0;bottom:0;height:168px;background:var(--panel);border-top:1px solid #d9dee7;display:flex;flex-direction:column;padding:8px 16px 12px;box-sizing:border-box}
#log{flex:1;overflow-y:auto;font-size:16px;line-height:1.5}
#log p{margin:4px 0;padding:4px 8px;border-radius:8px;max-width:85%}
#log .me{background:var(--me);margin-left:auto}
#log .ai{background:#f3f4f6}
#log .sys{color:var(--muted);font-size:12px;background:none}
form{display:flex;gap:8px;margin-top:6px}
input{flex:1;font-size:16px;padding:10px 12px;border:1px solid #c9d0db;border-radius:8px}
button{font-size:16px;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff}
button:disabled{opacity:.5}
#gear{position:fixed;top:8px;right:8px;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--text);border:1px solid #d9dee7;border-radius:50%;z-index:20;cursor:pointer}
#gear svg{width:22px;height:22px}
#settings{position:fixed;top:60px;right:8px;width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 248px);overflow-y:auto;background:var(--panel);border:1px solid #d9dee7;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:12px 16px 16px;box-sizing:border-box;z-index:20;font-size:16px}
#settings[hidden]{display:none}
#settings .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
#settings .head strong{font-size:16px}
#settings .close{width:44px;height:44px;padding:0;background:none;color:var(--text);font-size:22px}
#settings label{display:block;margin-top:12px}
#settings label>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
#settings select,#settings input[type=range]{width:100%;font-size:16px;box-sizing:border-box}
#settings select{padding:8px;border:1px solid #c9d0db;border-radius:8px;background:#fff;color:var(--text)}
#settings input[type=file]{font-size:12px;border:0;padding:0;width:100%}
#settings .bgs{display:flex;gap:8px;margin-top:4px}
#settings .bgs button{width:44px;height:44px;padding:0;border:2px solid #c9d0db;border-radius:50%}
#settings .bgs button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#status{font-size:12px;color:var(--muted);min-height:18px;margin-top:8px}
#status.err{color:#b42318}
#voiceNote{font-size:12px;color:#b42318;margin-top:4px}
#voiceNote:empty{display:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
  "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.3/lib/three-vrm.module.min.js"
}}
</script>
</head>
<body>
<div id="stage"></div>
<button id="gear" type="button" aria-label="設定" aria-expanded="false" aria-controls="settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>
<div id="settings" role="dialog" aria-label="設定" hidden>
  <div class="head"><strong>設定</strong><button type="button" class="close" id="close" aria-label="閉じる">×</button></div>
  <label><span>アバター</span><select id="model">
    <option value="./rinka.vrm">Rinka</option>
    <option value="./avatar-sample-a.vrm">AvatarSample_A</option>
  </select></label>
  <label><span>自分の VRM を読み込む（この端末の中だけで使い、送信しません）</span><input type="file" id="file" accept=".vrm"></label>
  <div id="status" role="status"></div>
  <label><span>言語</span><select id="lang"><option value="ja">日本語</option><option value="en">English</option></select></label>
  <label><span>声</span><select id="voice"><option value="">自動</option></select></label>
  <div id="voiceNote" role="status"></div>
  <label><span>話す速さ <output id="rateOut">1.05</output></span><input type="range" id="rate" min="0.7" max="1.5" step="0.05" value="1.05"></label>
  <label><span>背景色</span></label>
  <div class="bgs" id="bgs">
    <button type="button" data-bg="#eef1f5" style="background:#eef1f5" aria-label="グレー"></button>
    <button type="button" data-bg="#fdf1e4" style="background:#fdf1e4" aria-label="クリーム"></button>
    <button type="button" data-bg="#e6f4ea" style="background:#e6f4ea" aria-label="ミント"></button>
    <button type="button" data-bg="#fbe7ef" style="background:#fbe7ef" aria-label="ピンク"></button>
    <button type="button" data-bg="#2a3040" style="background:#2a3040" aria-label="紺"></button>
  </div>
</div>
<div id="panel">
  <div id="log"><p class="ai" id="greet">こんにちは！なんでも話しかけてね。</p></div>
  <script>/* あいさつはアバターの読み込みを待たずに最初の表示で出す（英語設定なら英語に） */
  try { if (JSON.parse(localStorage.getItem('avatar-chat-settings') || '{}').lang === 'en') document.getElementById('greet').textContent = 'Hi! Talk to me anytime.'; } catch {}</script>
  <form id="f"><input id="q" placeholder="話しかける" autocomplete="off" required><button id="send">送信</button></form>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// ---- アバター表示 ----
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f5);
// 光（MToon は光を受けて影色に切り替わる）
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(0.6, 1.6, 2.0);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd6dbe6, 1.2));
const camera = new THREE.PerspectiveCamera(25, 1, 0.1, 20);
camera.position.set(0, 1.4, 1.6);
camera.lookAt(0, 1.3, 0);
// モデルの大きさに合わせて、頭の上から胸の下までが入るようにカメラを置く（頭身が違っても顔が切れない）
function frameCamera(v) {
  v.scene.updateMatrixWorld(true);
  const headY = v.humanoid.getNormalizedBoneNode('head').getWorldPosition(new THREE.Vector3()).y;
  const top = new THREE.Box3().setFromObject(v.scene).max.y + 0.06;
  const bottom = headY - (top - headY) * 1.6;
  const half = (top - bottom) / 2, mid = (top + bottom) / 2;
  const dist = half / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.position.set(0, mid + 0.02, dist);
  camera.lookAt(0, mid, 0);
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---- 設定（localStorage は使えなくても動く） ----
const KEY = 'avatar-chat-settings';
const settings = { model: './rinka.vrm', voice: '', rate: 1.05, bg: '#eef1f5', lang: 'ja' };
try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
if (settings.lang !== 'en') settings.lang = 'ja';
function save() { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch {} }

const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
const statusEl = document.getElementById('status');
function setStatus(text, err) { statusEl.textContent = text; statusEl.className = err ? 'err' : ''; }
let vrm = null, armSign = 1, loadSeq = 0;
// 失敗したら前のモデルを残す。読み込み中に別のモデルを選んだら、後から選んだ方を使う
async function loadModel(url, label) {
  const seq = ++loadSeq;
  setStatus(`${label} を読み込み中…`);
  try {
    const next = (await loader.loadAsync(url)).userData.vrm;
    if (!next || !next.humanoid) throw new Error('VRM ではありません');
    if (seq !== loadSeq) { VRMUtils.deepDispose(next.scene); return false; }
    const isVRM0 = next.meta?.metaVersion === '0';
    if (isVRM0) VRMUtils.rotateVRM0(next); // VRM 0.x は向きが逆なので正面に向ける
    if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
    vrm = next; armSign = isVRM0 ? 1 : -1;
    scene.add(vrm.scene); frameCamera(vrm);
    setStatus('');
    return true;
  } catch (e) {
    if (seq === loadSeq) setStatus(`読み込めませんでした（${e.message || e}）。前のアバターのままです。`, true);
    return false;
  }
}
const modelSel = document.getElementById('model');
if (![...modelSel.options].some(o => o.value === settings.model)) settings.model = './rinka.vrm';
modelSel.value = settings.model;
// 読み込みを待たずに先へ進む（あいさつ・入力欄をすぐ使えるようにする。アバターは読み込めた時点で出る）
loadModel(settings.model, modelSel.selectedOptions[0].text).then(ok => {
  if (!ok && loadSeq === 1 && settings.model !== './rinka.vrm') { settings.model = modelSel.value = './rinka.vrm'; loadModel(settings.model, 'Rinka'); }
});

// ---- 話している間だけ口を動かす（音声から口形は取れないので、母音をランダムに切り替える） ----
let speaking = false, vowel = 'aa', nextSwitch = 0;
const vowels = ['aa', 'ih', 'ou', 'ee', 'oh'];
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (!vrm) { renderer.render(scene, camera); return; }
  const h = vrm.humanoid, em = vrm.expressionManager;
  // 腕を下ろす（VRM 0.x を回転させた後と VRM 1.0 では向きが逆）
  h.getNormalizedBoneNode('leftUpperArm').rotation.z = 1.2 * armSign;
  h.getNormalizedBoneNode('rightUpperArm').rotation.z = -1.2 * armSign;
  h.getNormalizedBoneNode('spine').rotation.x = Math.sin(t * 1.5) * 0.02;
  h.getNormalizedBoneNode('head').rotation.z = speaking ? Math.sin(t * 3) * 0.04 : 0;
  em.setValue('blink', (t % 4) < 0.15 ? 1 : 0);
  if (t > nextSwitch) { vowel = vowels[Math.floor(Math.random() * vowels.length)]; nextSwitch = t + 0.09 + Math.random() * 0.08; }
  for (const v of vowels) em.setValue(v, speaking && v === vowel ? 0.4 + 0.6 * Math.abs(Math.sin(t * 18)) : 0);
  vrm.update(dt);
  renderer.render(scene, camera);
});

// ---- 音声（ブラウザ内蔵の読み上げ。無料・外部送信なし） ----
// 選んだ言語の声だけを使う（声の設定が別の言語なら、その言語の最初の声）
function langVoices() { return speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(settings.lang)); }
const VOICE_PREF = {
  en: [/Google US English/, /Aria/, /Jenny/, /Zira/, /Samantha/, /Female/i],
  ja: [/Nanami/, /Google/, /Haruka/, /Ayumi/, /Sayaka/, /Kyoko/],
};
function pickVoice() {
  const vs = langVoices();
  const chosen = settings.voice && vs.find(v => v.voiceURI === settings.voice);
  if (chosen) return chosen;
  // 自動のときは女性の声を名前の優先順で選ぶ（一覧の順で選ぶと Windows では男性の声 Mark / David になる）
  for (const re of VOICE_PREF[settings.lang]) { const v = vs.find(v => re.test(v.name)); if (v) return v; }
  return vs[0] || null;
}
function speak(text) {
  return new Promise(resolve => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voice = pickVoice();
    u.voice = voice; u.lang = settings.lang === 'en' ? 'en-US' : 'ja-JP'; u.rate = settings.rate;
    window.__lastUtterance = u; // 確認用
    u.onstart = () => { speaking = true; };
    u.onend = u.onerror = () => { speaking = false; resolve(); };
    speechSynthesis.speak(u);
  });
}

// ---- チャット ----
const log = document.getElementById('log'), form = document.getElementById('f'), q = document.getElementById('q'), send = document.getElementById('send');
const history = [];
// デモ用の決まった返事（AI にはつながっていない）
function mockReply(text) {
  const head = Array.from(text).slice(0, 40).join('');
  const msg = settings.lang === 'en'
    ? `(Demo) You said: “${head}”. This demo isn't connected to AI, so I reply with a fixed message.`
    : `（デモ）『${head}』ですね。このデモは AI につながっていないので、決まった返事をしています。`;
  return new Promise(r => setTimeout(() => r(msg), 300));
}
// ローカル（node local-server.mjs）で開いたときだけ AI に返事させる。公開ページは決まった返事のまま
let aiAvailable = ['localhost', '127.0.0.1'].includes(location.hostname);
async function getReply(text) {
  if (!aiAvailable) return mockReply(text);
  const r = await fetch('api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ lang: settings.lang, messages: history }) });
  // AI の中継が無い（別のサーバーで開いた）／キー未設定なら、以後は決まった返事にする
  if ([404, 405, 501, 503].includes(r.status)) {
    aiAvailable = false;
    add('sys', settings.lang === 'en' ? 'AI is not set up, so fixed replies are used.' : 'AI が設定されていないため、決まった返事にします。');
    return mockReply(text);
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok || !data.reply) throw new Error(data.error || 'upstream');
  return data.reply;
}
function add(cls, text) { const p = document.createElement('p'); p.className = cls; p.textContent = text; log.appendChild(p); log.scrollTop = log.scrollHeight; }
form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; send.disabled = true;
  add('me', text); history.push({ role: 'user', content: text });
  try {
    const answer = await getReply(text);
    history.push({ role: 'assistant', content: answer });
    add('ai', answer);
    await speak(answer);
  } catch {
    history.pop(); add('sys', '返答を取得できませんでした。もう一度送ってください。');
  } finally { send.disabled = false; q.focus(); }
});

// ---- 設定パネル ----
const gear = document.getElementById('gear'), panelEl = document.getElementById('settings');
function openPanel(open) { panelEl.hidden = !open; gear.setAttribute('aria-expanded', String(open)); }
gear.addEventListener('click', () => openPanel(panelEl.hidden));
document.getElementById('close').addEventListener('click', () => { openPanel(false); gear.focus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panelEl.hidden) { openPanel(false); gear.focus(); } });
document.addEventListener('pointerdown', e => { if (!panelEl.hidden && !panelEl.contains(e.target) && !gear.contains(e.target)) openPanel(false); });

let blobUrl = null;
modelSel.addEventListener('change', async () => {
  const url = modelSel.value;
  if (url === 'local') return;
  if (await loadModel(url, modelSel.selectedOptions[0].text)) {
    settings.model = url; save();
    modelSel.querySelector('option[value=local]')?.remove();
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
  } else modelSel.value = blobUrl ? 'local' : settings.model;
});
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f); // 端末の中で読むだけ。どこにも送らない
  if (await loadModel(url, f.name)) {
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = url;
    let opt = modelSel.querySelector('option[value=local]');
    if (!opt) { opt = new Option('', 'local'); modelSel.add(opt); }
    opt.text = `自分の VRM: ${f.name}`; modelSel.value = 'local';
  } else URL.revokeObjectURL(url);
  e.target.value = '';
});

const voiceSel = document.getElementById('voice'), voiceNote = document.getElementById('voiceNote'), langSel = document.getElementById('lang');
function fillVoices() {
  const vs = langVoices().sort((a, b) => a.name.localeCompare(b.name));
  voiceSel.length = 1;
  for (const v of vs) voiceSel.add(new Option(`${v.name}（${v.lang}）`, v.voiceURI));
  voiceSel.value = vs.some(v => v.voiceURI === settings.voice) ? settings.voice : '';
  // 声の一覧は読み込みが遅れることがあるので、一覧が空のうちは注意を出さない
  voiceNote.textContent = speechSynthesis.getVoices().length && !vs.length ? 'この言語の声が見つかりません' : '';
}
langSel.value = settings.lang;
fillVoices();
speechSynthesis.addEventListener('voiceschanged', fillVoices);
voiceSel.addEventListener('change', () => { settings.voice = voiceSel.value; save(); });
langSel.addEventListener('change', () => { settings.lang = langSel.value === 'en' ? 'en' : 'ja'; save(); fillVoices(); });

const rate = document.getElementById('rate'), rateOut = document.getElementById('rateOut');
settings.rate = Math.min(1.5, Math.max(0.7, Number(settings.rate) || 1.05));
rate.value = settings.rate;
rateOut.textContent = settings.rate.toFixed(2);
rate.addEventListener('input', () => { settings.rate = Number(rate.value); rateOut.textContent = settings.rate.toFixed(2); save(); });

const bgs = document.getElementById('bgs');
function applyBg(c) {
  if (!/^#[0-9a-f]{6}$/i.test(c)) c = '#eef1f5';
  settings.bg = c; scene.background = new THREE.Color(c);
  for (const b of bgs.children) b.setAttribute('aria-pressed', String(b.dataset.bg === c));
}
applyBg(settings.bg);
bgs.addEventListener('click', e => { const b = e.target.closest('button[data-bg]'); if (b) { applyBg(b.dataset.bg); save(); } });
// ---- 開いたらすぐ一言（表示はすぐ。ブラウザは操作前の読み上げを止めるので、まだ操作していなければ最初のクリック・キー入力で話す） ----
const greeting = document.getElementById('greet').textContent; // 表示は HTML 側で済んでいる。会話履歴（AI へ送る分）には入れない
if (!navigator.userActivation || navigator.userActivation.hasBeenActive) speak(greeting);
else {
  const greetOnce = () => { removeEventListener('pointerdown', greetOnce, true); removeEventListener('keydown', greetOnce, true); if (!history.length) speak(greeting); };
  addEventListener('pointerdown', greetOnce, true); addEventListener('keydown', greetOnce, true);
}
window.__chat = { get vrm() { return vrm; }, settings, loadModel }; // 確認用
</script>
</body>
</html>
