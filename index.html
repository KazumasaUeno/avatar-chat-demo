<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アバターと話す</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--text:#1d2330;--muted:#6b7280;--accent:#3b6fd8;--me:#dfe8fb}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif}
#stage{position:fixed;inset:0 0 168px 0}
#panel{position:fixed;left:0;right:0;bottom:0;height:168px;background:var(--panel);border-top:1px solid #d9dee7;display:flex;flex-direction:column;padding:8px 16px 12px;box-sizing:border-box}
#log{flex:1;overflow-y:auto;font-size:16px;line-height:1.5}
#log p{margin:4px 0;padding:4px 8px;border-radius:8px;max-width:85%}
#log .me{background:var(--me);margin-left:auto}
#log .ai{background:#f3f4f6}
#log .sys{color:var(--muted);font-size:12px;background:none}
form{display:flex;gap:8px;margin-top:6px}
input{flex:1;font-size:16px;padding:10px 12px;border:1px solid #c9d0db;border-radius:8px}
button{font-size:16px;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff}
button:disabled{opacity:.5}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
  "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.3/lib/three-vrm.module.min.js"
}}
</script>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <div id="log"></div>
  <form id="f"><input id="q" placeholder="話しかける" autocomplete="off" required><button id="send">送信</button></form>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// ---- アバター表示 ----
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f5);
// 光（MToon は光を受けて影色に切り替わる）
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(0.6, 1.6, 2.0);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd6dbe6, 1.2));
const camera = new THREE.PerspectiveCamera(25, 1, 0.1, 20);
camera.position.set(0, 1.4, 1.6);
camera.lookAt(0, 1.3, 0);
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
const vrm = (await loader.loadAsync('./avatar-sample-a.vrm')).userData.vrm;
VRMUtils.rotateVRM0(vrm); // VRM 0.x は向きが逆なので正面に向ける
scene.add(vrm.scene);

// ---- 話している間だけ口を動かす（音声から口形は取れないので、母音をランダムに切り替える） ----
let speaking = false, vowel = 'aa', nextSwitch = 0;
const vowels = ['aa', 'ih', 'ou', 'ee', 'oh'];
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime, h = vrm.humanoid, em = vrm.expressionManager;
  h.getNormalizedBoneNode('leftUpperArm').rotation.z = 1.2;
  h.getNormalizedBoneNode('rightUpperArm').rotation.z = -1.2;
  h.getNormalizedBoneNode('spine').rotation.x = Math.sin(t * 1.5) * 0.02;
  h.getNormalizedBoneNode('head').rotation.z = speaking ? Math.sin(t * 3) * 0.04 : 0;
  em.setValue('blink', (t % 4) < 0.15 ? 1 : 0);
  if (t > nextSwitch) { vowel = vowels[Math.floor(Math.random() * vowels.length)]; nextSwitch = t + 0.09 + Math.random() * 0.08; }
  for (const v of vowels) em.setValue(v, speaking && v === vowel ? 0.4 + 0.6 * Math.abs(Math.sin(t * 18)) : 0);
  vrm.update(dt);
  renderer.render(scene, camera);
});

// ---- 音声（ブラウザ内蔵の読み上げ。無料・外部送信なし） ----
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith('ja'));
  return vs.find(v => /Nanami|Google/.test(v.name)) || vs[0] || null;
}
function speak(text) {
  return new Promise(resolve => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.voice = pickVoice(); u.rate = 1.05;
    u.onstart = () => { speaking = true; };
    u.onend = u.onerror = () => { speaking = false; resolve(); };
    speechSynthesis.speak(u);
  });
}

// ---- チャット ----
const log = document.getElementById('log'), form = document.getElementById('f'), q = document.getElementById('q'), send = document.getElementById('send');
const history = [];
// デモ用の決まった返事（AI にはつながっていない）
function mockReply(text) {
  const head = Array.from(text).slice(0, 40).join('');
  return new Promise(r => setTimeout(() => r(`（デモ）『${head}』ですね。このデモは AI につながっていないので、決まった返事をしています。`), 300));
}
function add(cls, text) { const p = document.createElement('p'); p.className = cls; p.textContent = text; log.appendChild(p); log.scrollTop = log.scrollHeight; }
form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; send.disabled = true;
  add('me', text); history.push({ role: 'user', content: text });
  try {
    const answer = await mockReply(text);
    history.push({ role: 'assistant', content: answer });
    add('ai', answer);
    await speak(answer);
  } catch {
    history.pop(); add('sys', '返答を取得できませんでした。もう一度送ってください。');
  } finally { send.disabled = false; q.focus(); }
});
</script>
</body>
</html>
